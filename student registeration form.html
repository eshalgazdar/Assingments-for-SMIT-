<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-container">
     <h1>Student Registration Form</h1>
    <form>
         <div class="form-group">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname">
        </div>

        <div class="form-group">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password">
        </div>

         <div class="form-group">
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob">
        </div>
        <div class="option-group">
            <label>Gender:</label><br>
            <div class="options">
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br>
             </div>
         </div> 

        <div class="option-group">
            <label>Favorite Programming Languages:</label><br>
            <div class="option">
               <input type="checkbox" id="cplusplus" name="languages" value="cplusplus">
               <label for="cplusplus">C++</label><br>
               <input type="checkbox" id="html_lang" name="languages" value="html">
               <label for="html_lang">HTML</label><br>
               <input type="checkbox" id="javascript" name="languages" value="javascript">
               <label for="javascript">JavaScript</label>
            </div>
        </div>

        <div class="form-group">
            <label for="city">City:</label><br>
            <select id="city" name="city">
                <option value="">--Select a City--</option>
                <option value="karachi">Karachi</option>
                <option value="lahore">Lahore</option>
                <option value="islamabad">Islamabad</option>
                <option value="rawalpindi">Rawalpindi</option>
            </select>
        </div>

         <div class="form-group">
            <label for="about">About Yourself:</label><br>
            <textarea id="about" name="about" rows="5" cols="40"></textarea>
        </div>

        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>
    </div>
</div>
</body>
</html>
